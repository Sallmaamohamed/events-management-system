<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Booking Platform</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">EventSys</div>
    <nav class="nav-links">
      <a href="#events">Events</a>
      <a href="#my-tickets" id="myTicketsLink" style="display: none;">My Tickets</a>
      <button id="authBtn" onclick="toggleAuthModal()">Login</button>
    </nav>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Discover & Book Events</h1>
      <p>Find the best workshops, concerts, and tech conferences near you.</p>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search events by name...">
        <button onclick="fetchEvents()">Search</button>
      </div>
    </section>

    <section id="events" class="events-section">
      <h2>Upcoming Events</h2>
      <div id="eventsGrid" class="events-grid">
        <!-- Events rendered dynamically -->
      </div>
    </section>

    <section id="my-tickets" class="tickets-section" style="display: none;">
      <h2>My Reserved Tickets</h2>
      <div id="ticketsGrid" class="tickets-grid">
        <!-- User tickets rendered dynamically -->
      </div>
    </section>
  </main>

  <!-- Auth Modal -->
  <div id="authModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="toggleAuthModal()">&times;</span>
      <h3 id="modalTitle">Account Login</h3>
      <form id="authForm" onsubmit="handleAuth(event)">
        <div class="input-group" id="nameGroup" style="display: none;">
          <label>Full Name</label>
          <input type="text" id="userNameInput">
        </div>
        <div class="input-group">
          <label>Email Address</label>
          <input type="email" id="emailInput" required>
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="passwordInput" required>
        </div>
        <button type="submit" class="btn-primary" id="submitAuthBtn">Sign In</button>
      </form>
      <p class="toggle-text">
        <span id="toggleText">Don't have an account?</span> 
        <a href="#" onclick="switchAuthMode(event)" id="toggleLink">Register</a>
      </p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
